[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmadantic"
version = "0.1.0"
description = "Typed parsing and warning state management for JMA disaster prevention XML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["xsdata>=26.10,<27", "lxml>=5"]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest", "pyright", "ruff", "openpyxl", "xsdata[cli]==26.10"]

[tool.hatch.build.targets.wheel]
packages = ["jmadantic"]

[tool.pyright]
pythonVersion = "3.11"
strict = ["jmadantic"]
exclude = ["jmadantic/_generated", ".venv", "vendor", "tests/golden/_build_fixtures.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["jmadantic/_generated", "tests/golden/_build_fixtures.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
